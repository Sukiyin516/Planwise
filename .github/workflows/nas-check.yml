name: NAS preview checks
on:
  push:
    branches: [feature/nas-server]
  pull_request:
    paths: ['nas/**', '.dockerignore', '.github/workflows/nas-check.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r nas/requirements.txt
      - run: python -m unittest discover -v
      - run: node --check nas/static/ui.js
      - run: node --test nas/test_client.cjs
      - run: node --check android/runtime/app.js
      - run: docker compose config --quiet
      - run: docker compose -f nas/compose.yaml config --quiet
      - run: docker build --platform linux/amd64 -f nas/Dockerfile -t planwise-nas:test .
      - name: Test persistent container storage and production HTTP server
        run: |
          docker volume create nas-ci-data
          docker run -d --name nas-test --read-only --tmpfs /tmp -v nas-ci-data:/data -p 127.0.0.1:8088:8080 planwise-nas:test
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8088/healthz; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:8088/healthz
          docker exec nas-test python -c "from nas.database import Database; Database('/data/planwise.sqlite3').create_user('ciuser','temporary-ci-password')"
          curl --fail -c /tmp/nas-cookies -H 'Content-Type: application/json' -H 'X-Planwise-Client: 1' -d '{"username":"ciuser","password":"temporary-ci-password"}' http://127.0.0.1:8088/api/login
          curl --fail -b /tmp/nas-cookies http://127.0.0.1:8088/api/state
          docker restart nas-test
          sleep 4
          curl --fail -b /tmp/nas-cookies http://127.0.0.1:8088/api/state
      - if: failure()
        run: docker logs nas-test || true
