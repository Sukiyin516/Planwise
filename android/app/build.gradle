plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}
android {
    namespace 'hk.planwise.app'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'hk.planwise.app'
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName '0.5.1-preview'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    buildTypes {
        debug { debuggable false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
chaquopy {
    defaultConfig {
        version = '3.14'
        buildPython(System.getenv('PLANWISE_BUILD_PYTHON') ?: 'python3.14')
        pyc { src = false }
    }
}
