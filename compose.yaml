# Copy this file alone into a fnOS Docker Compose project.
# The NAS downloads the verified NAS 0.1.0 source when building the image.
name: planwise-nas
services:
  planwise:
    build:
      context: "https://github.com/Z3ych1k/Planwise.git#9b927c5e76f2096d7b305748e3221562c919ea3d"
      dockerfile: nas/Dockerfile
    platform: linux/amd64
    image: planwise-nas:0.1.0
    pull_policy: build
    ports:
      - "${PLANWISE_BIND_IP:-0.0.0.0}:${PLANWISE_PORT:-9473}:8080"
    environment:
      PLANWISE_DATABASE: /data/planwise.sqlite3
      PLANWISE_COOKIE_SECURE: "${PLANWISE_COOKIE_SECURE:-0}"
    volumes:
      - planwise-data:/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    stop_grace_period: 30s
volumes:
  planwise-data:
